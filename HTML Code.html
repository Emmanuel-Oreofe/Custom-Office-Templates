<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Page</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        header { background: #6200ea; color: white; padding: 20px; text-align: center; }
        section { padding: 20px; }
        button { padding: 10px 15px; background: #03dac6; border: none; cursor: pointer; }
        button:hover { background: #018786; color: white; }
        footer { background: #333; color: white; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Random HTML Page</h1>
    </header>
    <section>
        <p>This is a simple randomly generated HTML example.</p>
        <p>Click the button below to see a message.</p>
        <button onclick="showMessage()">Click Me</button>
        <p id="output"></p>
    </section>
    <footer>
        <p>&copy; 2026 Random Web Project</p>
    </footer>
    <script>
        function showMessage() {
            document.getElementById("output").innerHTML = "Hello! You clicked the button.";
        }
    </script>
</body>
</html>
